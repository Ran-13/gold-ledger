[[permission]]
identifier = "allow-backup-database"
description = "Allow backing up the SQLite database"
commands.allow = ["backup_database"]

[[permission]]
identifier = "allow-restore-database"
description = "Allow restoring the SQLite database"
commands.allow = ["restore_database"]

[[permission]]
identifier = "allow-get-db-file-path"
description = "Allow reading the database file path"
commands.allow = ["get_db_file_path"]

[[permission]]
identifier = "allow-auto-backup-database"
description = "Allow automatic AppData backups"
commands.allow = ["auto_backup_database"]

[[permission]]
identifier = "allow-get-auto-backup-status"
description = "Allow reading auto backup status"
commands.allow = ["get_auto_backup_status"]

[[permission]]
identifier = "allow-get-backups-dir"
description = "Allow reading the backups folder path"
commands.allow = ["get_backups_dir"]
